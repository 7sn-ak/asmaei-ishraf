<div id="app">
  <header class="mast">
    <div class="mast-in">
      <div class="brand">
        <img class="logo" src="icons/logo.png" alt="" width="40" height="40">
        <div>
          <div class="wm">سجل الإشراف</div>
          <div class="wm-sub">مدرسة الأصمعي</div>
        </div>
      </div>
      <span class="grow"></span>
      <button class="iconbtn" id="bellBtn" data-act="go" data-v="inbox" aria-label="الإشعارات" hidden>
        <svg class="ic"><use href="#i-bell"/></svg>
        <span class="badge" id="bellBadge" hidden>0</span>
      </button>
    </div>

      <button data-act="go" data-v="students" data-tab="students"><svg class="ic"><use href="#i-users"/></svg><span>الطلاب</span></button>

      <button data-act="go" data-v="more" data-tab="more"><svg class="ic"><use href="#i-more"/></svg><span>المزيد</span></button>
    </div>
  </nav>
