name: نشر الموقع

# يعمل تلقائياً مع كل تحديث على الفرع main:
# 1) يحدّث قاعدة البيانات ووظائف الخادم في Supabase
# 2) ينشر ملفات الموقع على GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  backend:
    name: قاعدة البيانات ووظائف الخادم
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      # اختياري: إذا لم تُضف المفاتيح السرية تُتخطى هذه الخطوات، وتُحدَّث قاعدة البيانات عبر Claude (موصّل Supabase)
      - name: هل النشر التلقائي لقاعدة البيانات مفعّل؟
        id: check
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::لا توجد مفاتيح Supabase السرية، فتُنشر ملفات الموقع فقط."
          fi

      - uses: supabase/setup-cli@v3
        if: steps.check.outputs.enabled == 'true'
        with:
          version: 2.118.0

      - name: ربط مشروع Supabase
        if: steps.check.outputs.enabled == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: تحديث قاعدة البيانات
        if: steps.check.outputs.enabled == 'true'
        run: supabase db push --yes

      - name: نشر وظائف الخادم
        if: steps.check.outputs.enabled == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: إغلاق التسجيل العام (الحسابات يضيفها مسؤول الموقع فقط)
        if: steps.check.outputs.enabled == 'true'
        run: |
          curl -sSf -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"disable_signup": true}' > /dev/null

  site:
    name: الموقع
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: رقم الإصدار (حتى تتحدث الجوالات بالنسخة الجديدة)
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/" site/sw.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
